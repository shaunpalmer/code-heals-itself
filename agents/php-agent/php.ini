;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP OPcache Configuration for Code-Heals-Itself PHP Agent
; Optimized for: Fast startup, minimal memory, production readiness
; Target: <50ms cold start with preload
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;;;;;;; OPcache Core Settings ;;;;;;;;;;;;;;;;;;;;;

; Enable OPcache
opcache.enable=1

; Enable for CLI mode (important for agents/scripts)
opcache.enable_cli=1

; Memory allocation for opcode cache (MB)
; 128 MB = ~500K-1M function definitions (plenty for our ~5K PHP lines)
opcache.memory_consumption=128

; Memory allocation for interned strings (reduces string duplication)
opcache.interned_strings_buffer=16

; Maximum number of cached files
opcache.max_accelerated_files=10000

; Revalidate code changes (optimization)
; 0 = Never revalidate (production mode - FAST)
; 60+ = Check every N seconds (dev mode)
; PRODUCTION: set to 0 for maximum speed
opcache.validate_timestamps=0

; Frequency of timestamp check (seconds)
; Only used if validate_timestamps=1
opcache.revalidate_freq=0

; ============================================================================
; PRELOADING: Load entire agent codebase at startup (FASTEST)
; ============================================================================
; Preload is set via -d opcache.preload flag in Dockerfile.php CMD
; This runs ONCE when PHP-CLI starts, warming entire OPcache before execution
; Result: Cold start ~500ms → ~50ms

; Allow preload in CLI (needed for scripts/testing)
opcache.preload_user=www-data

; ============================================================================
; Performance Tuning
; ============================================================================

; Fast ZendAPI internal function calls
opcache.fast_startup=1

; Save/restore preloaded script state
opcache.save_comments=1
opcache.load_comments=1

; JIT (Just-In-Time) compilation - PHP 8.0+
; Aggressive settings for maximum performance
; 1205 = enable JIT, tracing mode, all optimizations
opcache.jit=1205
opcache.jit_buffer_size=256M
opcache.jit_max_trace_length=1432
opcache.jit_max_root_trace_length=891
opcache.jit_max_side_trace_length=181
opcache.jit_hot_loop_cycles=64
opcache.jit_hot_func_calls=27

; Recompile stale code in background
opcache.file_cache=/dev/shm/php-opcache
opcache.file_cache_consistency_level=0

; ============================================================================
; Error Handling (keep verbose for debugging)
; ============================================================================

error_reporting=E_ALL
display_errors=0
log_errors=1
error_log=/var/log/php-errors.log

; ============================================================================
; Memory & Execution Limits
; ============================================================================

memory_limit=512M
max_execution_time=300
default_socket_timeout=60

; ============================================================================
; Extensions & Libraries
; ============================================================================

; Ensure these are loaded (for agents/pipeline)
extension=json
extension=pcre
extension=reflection

; ============================================================================
; Timezone (for logging)
; ============================================================================
date.timezone=UTC

; ============================================================================
; Disable Unnecessary Features (speed boost)
; ============================================================================

; Disable short tags (use <?php only)
short_open_tag=0

; Disable auto_prepend/append (we use preload instead)
auto_prepend_file=
auto_append_file=

; ============================================================================
; Session Configuration (if needed for future API)
; ============================================================================
session.save_handler=files
session.cache_limiter=
session.use_strict_mode=1

; ============================================================================
; END OF OPTIMIZED CONFIGURATION
; ============================================================================
